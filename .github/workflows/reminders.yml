name: Sparky reminders
# Every 15 minutes: read what the app posted, send due reminders, save state. GitHub can start scheduled runs a few minutes late.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sparky-reminders
  cancel-in-progress: false
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Get the state branch
        run: |
          git fetch origin state && git worktree add statebr origin/state || { git worktree add --detach statebr && cd statebr && git checkout --orphan state && git rm -rfq . ; }
      - name: Restore private state
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: private
          key: sparky-private-${{ github.run_id }}
          restore-keys: sparky-private-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund web-push@3.6.7
      - name: Send reminders
        id: run
        env:
          RELAY: https://ntfy.sh/sparky-atnAadAj93UPoNdCk9OgzNoj
          PRIVATE_FILE: private/private.json
          PUBLIC_FILE: statebr/state.json
        run: mkdir -p private && node reminders/remind.mjs
      - name: Save private state
        if: steps.run.outputs.private == '1'
        uses: actions/cache/save@v4
        with:
          path: private
          key: sparky-private-${{ github.run_id }}
      - name: Save public state
        if: steps.run.outputs.public == '1'
        working-directory: statebr
        run: |
          git config user.name "sparky-reminders"
          git config user.email "sparky-reminders@users.noreply.github.com"
          git add state.json && git commit -qm "Update state" && git push origin HEAD:state
